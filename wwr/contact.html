<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Sarala:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/rafting.css">    
    <title>Contact Us | White Water Rafting</title>
</head>
<body>
    <header>
        <img src="images/dryoarlogo.webp" alt="White Water Rafting Logo" id="image-logo">
        <nav>
            <ul class="navigation">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Contact Us</h1>
        <div class="company-info">
            <address class="info">
                <h2>We're located at:</h2>
                1234 River Rafting Blvd<br>
                Oxbow, OR 97840<br>
                Call us: <a href="tel:+1234567890" class="info-detail">+1 (234) 567-8900</a><br>
                Email us: <a href="mailto:electronicmail@rafting.com" class="info-detail">electronicmail@rafting.com</a>
            </address>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d18768.93370640349!2d-116.79288537801985!3d45.07525559023961!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x54a421007b1e59a7%3A0x80b4775f5c0a26f8!2sCopper%20Creek%20Campground!5e0!3m2!1sen!2sus!4v1749255556035!5m2!1sen!2sus" width="400" height="300" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <section class="contact-form-section">
            <h2>Get in Touch</h2> 
            <form action="https://example.com/submit" method="post" class="contact-form"> 
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" placeholder="Name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email Address" required>

                <div class="radio-group">
                    <label for="inquiry">General Inquiry
                        <input type="radio" id="inquiry" name="purpose">
                    </label>
                    <label for="question">Reservation Question
                        <input type="radio" id="question" name="purpose">
                    </label>
                    <label for="suggestion">Website Suggestion
                        <input type="radio" id="suggestion" name="purpose">
                    </label>
                </div>

                
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" placeholder="Your Message" required></textarea>

                <div class="checkbox-group">
                    <label for="newsletter">Please subscribe me to the monthly newsletter
                        <input type="checkbox" id="newsletter" name="newsletter">
                    </label>
                </div>
                
                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy;2025 | Dry Oar | Felipe Menezes</p>
        <a href="https://wireframe.cc/ytmw4u" target="_blank">Contact Us wireframe</a>
        <nav>
            <ul class="socialmedia">
                <li><a href="https://www.facebook.com/" target="_blank"><img src="images/icon_facebook.svg" alt="Facebook"></a></li>
                <li><a href="https://www.instagram.com/" target="_blank"><img src="images/icon_instagram.svg" alt="Instagram"></a></li>
                <li><a href="https://www.twitter.com/" target="_blank"><img src="images/icon_twitter.svg" alt="Twitter"></a></li>
            </ul>
        </nav>
    </footer>
</body>
</html>
